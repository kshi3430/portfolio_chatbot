# GitHub Actions - CI 검증 워크플로우 (CD는 Vercel Git Integration 사용)
name: Portfolio CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-data-and-python:
    name: Verify Data Sync & Python Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build and verify projects.json sync
        run: |
          python data/build.py
          git diff --exit-code data/projects.json web/data/projects.json

      - name: Verify Python syntax
        run: |
          python -m py_compile data/build.py server/api.py server/prompts.py server/rag_app.py server/rag_core.py

  verify-web:
    name: Lint & Build Web (Vercel Root)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npm run lint

      - name: Build web bundle
        working-directory: web
        run: npm run build

      - name: Build Vercel static bundle
        working-directory: web
        run: npx vite build
